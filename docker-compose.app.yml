services:
  inventory:
    build:
      context: .
      dockerfile_inline: |
        FROM node:22-bookworm-slim AS deps
        WORKDIR /app
        COPY package*.json ./
        RUN npm ci

        FROM deps AS build
        COPY tsconfig.json vite.config.ts index.html ./
        COPY src ./src
        COPY manifest ./manifest
        COPY migrations ./migrations
        RUN npm run build
        RUN npm run build:plugin

        FROM node:22-bookworm-slim AS runtime
        WORKDIR /app
        ENV NODE_ENV=production
        COPY package*.json ./
        RUN npm ci --omit=dev && npm cache clean --force
        COPY --from=build /app/dist ./dist
        COPY --from=build /app/dist-plugin ./dist-plugin
        COPY --from=build /app/manifest ./manifest
        COPY --from=build /app/migrations ./migrations
        EXPOSE 4010
        CMD ["node", "dist/server/index.js"]
    image: hc-app-inventory:local
    environment:
      PORT: "4010"
      DATABASE_URL: ${INVENTORY_DATABASE_URL:-postgres://hc_user:hc_password@postgres:5432/hc_core}
      INSTALLER_TOKEN_SECRET: ${INVENTORY_INSTALLER_TOKEN_SECRET:-${INSTALLER_TOKEN_SECRET:-dev-compose-installer-secret-change-me}}
      INSTALLER_TOKEN_ISSUER: ${INVENTORY_INSTALLER_TOKEN_ISSUER:-${INSTALLER_TOKEN_ISSUER:-hekatoncheiros-core-installer}}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - hekatoncheiros-core

networks:
  hekatoncheiros-core:
    external: true
    name: hekatoncheiros-core_default
